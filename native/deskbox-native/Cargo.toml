[package]
name = "deskbox-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "deskbox_native"
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
