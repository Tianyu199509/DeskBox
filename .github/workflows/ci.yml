name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      RestoreLockedMode: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: AI widget contract gates
        shell: pwsh
        # 契约 / 本地化 / 暂存协议门禁。脚本存在但没接 CI，等于没有门禁：
        # 「协议改成了暂存-提交、13 语还在承诺桌面热重载」就是这样漏过去的。
        # 放在构建之前，几秒钟就能拦住这类漂移，不用等 5 分钟测试跑完。
        run: |
          python -X utf8 scripts/check_ai_widget_contract.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'AI widget contract gate failed'
            exit 1
          }
          python -X utf8 scripts/check_ai_widget_localization.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'AI widget localization gate failed'
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
