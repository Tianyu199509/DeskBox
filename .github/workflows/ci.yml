name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      RestoreLockedMode: true
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit identity and attribution check
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TRIGGER_USER: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.actor }}
          ALLOWED_LOGIN: Tianyu199509
          ALLOWED_EMAIL: 1047078635@qq.com
        run: |
          if ($env:TRIGGER_USER -ne $env:ALLOWED_LOGIN) {
            Write-Host "Forbidden: trigger user '$env:TRIGGER_USER' is not the single-account owner ($env:ALLOWED_LOGIN)."
            exit 1
          }
          $base = $env:BASE_SHA
          $head = $env:HEAD_SHA
          $isNewRef = [string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$'
          if ($isNewRef) {
            $messages = git log -1 --format=%B $head
            $identities = git log -1 --no-merges --format='%ae%n%ce' $head
          } else {
            $messages = git log --format=%B "$base..$head"
            $identities = git log --no-merges --format='%ae%n%ce' "$base..$head"
          }
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }
          $bad = @($identities | Where-Object { $_ -and $_ -ne $env:ALLOWED_EMAIL })
          if ($bad.Count -gt 0) {
            Write-Host 'Forbidden: commit author/committer emails outside the single-identity whitelist:'
            $bad | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      - name: Internal docs and ops scripts leak check
        shell: pwsh
        run: |
          $pattern = '^(AGENTS\.md|CLAUDE\.md|docs/(architecture|acceptance|requirements|press-kit|baselines|audit|analysis|archive|wechat)(/|$)|docs/seo-content\.md$|scripts/([^/]*-protocol\.md|publish_widget_catalog\.py|store-[^/]*\.py)$|deskbox-site/|store-assets(-html)?/|store-listing/)'
          $leaked = @(git -c core.quotepath=false ls-files | Where-Object { $_ -match $pattern })
          if ($leaked.Count -gt 0) {
            Write-Host 'Forbidden internal documentation or local ops scripts are tracked in Git:'
            $leaked | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

      - name: AI widget contract gates
        shell: pwsh
        # 契约 / 本地化 / 暂存协议门禁。脚本存在但没接 CI，等于没有门禁：
        # 「协议改成了暂存-提交、13 语还在承诺桌面热重载」就是这样漏过去的。
        # 放在构建之前，几秒钟就能拦住这类漂移，不用等 5 分钟测试跑完。
        run: |
          python -X utf8 scripts/check_ai_widget_contract.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'AI widget contract gate failed'
            exit 1
          }
          python -X utf8 scripts/check_ai_widget_localization.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'AI widget localization gate failed'
            exit 1
          }

      - name: Rust native unit tests
        run: cargo test --manifest-path native/Cargo.toml --locked

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Verify release version consistency
        shell: pwsh
        run: .\scripts\Test-DeskBoxDirectReleaseConsistency.ps1

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Verify Store channel compilation
        run: dotnet build .\src\DeskBox\DeskBox.csproj -t:PrepareForBuild,ResolveReferences,PrepareResources,Compile --configuration Release --no-restore --no-dependencies -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:DeskBoxDistribution=Store -p:IntermediateOutputPath=obj\x64\Release-Store\net10.0-windows10.0.22621.0\win-x64\ -v:minimal

      - name: Verify Native AOT smoke harness compilation
        run: dotnet build .\src\DeskBox\DeskBox.csproj -t:PrepareForBuild,ResolveReferences,PrepareResources,Compile --configuration Release --no-restore --no-dependencies -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:DeskBoxAotSmokeHarness=true -p:DefineConstants="DISABLE_XAML_GENERATED_MAIN%3BDESKBOX_NATIVE_AOT%3BDESKBOX_AOT_SMOKE_HARNESS" -p:IntermediateOutputPath=obj\x64\Release-AotSmoke\net10.0-windows10.0.22621.0\win-x64\ -v:minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
