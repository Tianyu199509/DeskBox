name: ARM64 Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stage7b-arm64-actions

permissions:
  contents: read

concurrency:
  group: arm64-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: Native ARM64 ABI runtime
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      RestoreLockedMode: true

    steps:
      - name: Checkout isolated source snapshot
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303

      - name: Verify native ARM64 host and pinned Rust
        shell: pwsh
        run: |
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($processArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64 -or
              $osArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "Expected an ARM64 OS and process; OS=$osArchitecture process=$processArchitecture."
          }
          dotnet --info
          rustc -vV
          cargo --version
          $rustcDetails = rustc -vV | Out-String
          if ($rustcDetails -notmatch 'rustc 1\.96\.0' -or
              $rustcDetails -notmatch 'host: aarch64-pc-windows-msvc') {
            throw "The repository-pinned native ARM64 Rust 1.96.0 toolchain is not active."
          }

      - name: Restore ARM64 assets
        shell: pwsh
        run: >-
          dotnet restore .\DeskBox.sln
          --locked-mode
          -p:Platform=ARM64
          -p:RuntimeIdentifier=win-arm64
          --verbosity minimal

      - name: Run Stage 7B native ARM64 gate
        shell: pwsh
        run: >-
          .\scripts\run-arm64-stage-7b-runtime.ps1
          -Configuration Release
          -OutputDirectory .\.artifacts\arm64-stage7b-runtime
          -NoRestore

      - name: Run Stage 7C0 ARM64 CRT A/B gate
        shell: pwsh
        run: >-
          .\scripts\audit-rust-crt-distribution.ps1
          -Platforms ARM64
          -OutputDirectory .\.artifacts\rust-crt-stage7c0-arm64
          -MemoryProbeRounds 5
          -NoRestore

      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-stage7b-runtime-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            .artifacts/arm64-stage7b-runtime/*.json
            .artifacts/arm64-stage7b-runtime/**/*.trx
            .artifacts/arm64-stage7b-runtime/native/*.dll
            .artifacts/arm64-stage7b-runtime/search/*.dll

      - name: Upload ARM64 CRT distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-stage7c0-crt-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            .artifacts/rust-crt-stage7c0-arm64/*.json
            .artifacts/rust-crt-stage7c0-arm64/**/*.trx
            .artifacts/rust-crt-stage7c0-arm64/**/*.dll
